name: Build and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version: major.minor.patch, for example 1.2.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gamepad-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve and validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          $release = ./scripts/Get-ReleaseVersion.ps1 -Version $env:REQUESTED_VERSION -RequireVersion:($env:MANUAL_RUN -eq 'true')
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT

      - name: Fetch pinned build-only Patterns and MinHook dependency
        uses: actions/checkout@v4
        with:
          repository: ChiyukiKazama/FufuLauncher.UnlockerIsland
          ref: 7b0fce943feb0307bae38fb1c3eefa36cae12c86
          path: .ci-dependencies/UnlockerIsland
          persist-credentials: false
          sparse-checkout: |
            FufuLauncher.UnlockerIsland/Patterns
            FufuLauncher.UnlockerIsland/MinHook

      - name: Locate Visual Studio 2026 MSBuild
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -version '[18.0,19.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio 2026 MSBuild was not found.' }
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      - name: Build Release x64 with version resources
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -MSBuildPath $env:MSBUILD_PATH -UnlockerIslandRoot ./.ci-dependencies/UnlockerIsland -Version $env:RELEASE_VERSION

      - name: Compress, test, decompress and load the DLL in an isolated host
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Compress-Release.ps1 -Version $env:RELEASE_VERSION

      - name: Package defaults and verify contents, versions and SHA256
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./publish.ps1 -Version $env:RELEASE_VERSION -DllPath ./obj/release/GamepadCustomPlugin.dll

      - name: Test release state transitions without publishing
        run: node --test scripts/tests/publish-release.test.cjs

      - name: Retain completed package and store artifacts for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gamepad-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Create draft, upload and verify ZIP, then publish
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const publish = require('./scripts/publish-release.cjs');
            await publish({github, context, core});
